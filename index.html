<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- finup:navegador-sem-suporte -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEF1F6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#030712" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      Status bar do iPhone no app instalado (Tela de Início). "default" de propósito: o iOS desenha a
      barra do relógio com texto escuro/claro legível e o app começa ABAIXO dela. "black-translucent"
      deixa o texto do relógio SEMPRE branco e o app por baixo dele — no tema claro o relógio some (ou
      é preciso pintar uma faixa escura fixa, que destoa do tema). A meta só é lida ao abrir o app.
      viewport-fit=cover continua: dá o env(safe-area-inset-bottom) da barra de início (home
      indicator), que a barra inferior e o fim da rolagem compensam. O topo também usa
      env(safe-area-inset-top) (MobileShell, TelaCheia, Modal): com "default" ele vale 0 no retrato,
      mas a conta continua certa se a barra mudar.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finup" />
    <title>Finup</title>
    <!--
      Anti-flash de tema: aplica data-theme no <html> ANTES de pintar (antes do /src/main.jsx).
      ATENÇÃO — valores repetidos de propósito (o index.html não importa módulos antes do React):
        - media query de mobile  = MOBILE_MEDIA_QUERY em src/lib/breakpoints.js
        - chaves do localStorage = CHAVES_TEMA em src/hooks/useTheme.js
        - cores da barra         = THEME_COLOR e corBarra() em src/hooks/useTheme.js (= --color-page;
                                   escuro do computador = darkDesktop)
      Se mudar um, mude o outro: useIsMobile, useTheme e este script não podem discordar.
    -->
    <script>
      (function () {
        var MOBILE_MEDIA_QUERY = '(max-width: 767.98px)' // = src/lib/breakpoints.js
        var CHAVES = { mobile: 'finup_tema_mobile', desktop: 'finup_tema_desktop' }
        var THEME_COLOR = { dark: '#030712', light: '#EEF1F6', darkDesktop: '#16181D' }
        var tema = 'dark'
        var contexto = 'desktop'
        try {
          var mm = window.matchMedia
          contexto = mm && mm(MOBILE_MEDIA_QUERY).matches ? 'mobile' : 'desktop'
          var pref = null
          try { pref = window.localStorage.getItem(CHAVES[contexto]) } catch (e) { pref = null }
          if (pref === 'light') tema = 'light'
          else if (pref === 'system') tema = mm && mm('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        } catch (e) {
          tema = 'dark'
        }
        var html = document.documentElement
        html.setAttribute('data-theme', tema)
        html.style.colorScheme = tema
        // = corBarra() em src/hooks/useTheme.js
        var cor = tema === 'light' ? THEME_COLOR.light : contexto === 'desktop' ? THEME_COLOR.darkDesktop : THEME_COLOR.dark
        var metas = document.querySelectorAll('meta[name="theme-color"]')
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', cor)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
